    - { match: "*/rm *-fvr *", approval: deny }
    - { match: "*/rm *-fvr", approval: deny }
    - { match: "*/rm *-vrf *", approval: deny }
    - { match: "*/rm *-vrf", approval: deny }
    - { match: "*/rm *-vfr *", approval: deny }
