    - { match: "rm *-vfR", approval: deny }
    - { match: "rm *--recursive *", approval: deny }
    - { match: "rm *--recursive", approval: deny }
    - { match: "*/rm *-r *", approval: deny }
    - { match: "*/rm *-r", approval: deny }
    - { match: "*/rm *-rf *", approval: deny }
    - { match: "*/rm *-rf", approval: deny }
