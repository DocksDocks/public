    # literally (git push -u origin HEAD). No person is asked.
    # The leading * also reaches a git push after a shell keyword such as do,
    # after a wrapper such as env, and after a path such as /usr/bin/git.
    - { match: "*git push *$*", approval: deny }
    - { match: "*git push *`*", approval: deny }
