    - { match: "git push -f origin main", approval: deny }
    - { match: "git push -f origin main *", approval: deny }
    - { match: "git push -f origin master", approval: deny }
    - { match: "git push -f origin master *", approval: deny }
    # Allow, ahead of the prompts below: the option-terminated forms. After
    # `--`, every argument is a path, so no option can force or empty.
    - { match: "git rm -- *", approval: allow }
    - { match: "git worktree remove -- *", approval: allow }
    - { match: "gio trash -- *", approval: allow }
    # Prompt: every other rm, git rm, git worktree remove, and gio trash; bulk
    # deletion; history-destroying git; every git push spelling that could
    # force. A subagent cannot answer a prompt, so omp rejects it.
    - { match: "rm", approval: prompt }
    - { match: "rm *", approval: prompt }
    - { match: "*/rm", approval: prompt }
