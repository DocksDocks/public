statusLine:
  compactThinkingLevel: false

defaultThinkingLevel: high

cycleOrder:
  - smol
  - default
  - slow
  - fable
  - astra

tier:
  openai: none
  anthropic: none

advisor:
  enabled: true
  syncBacklog: "1"

github:
  enabled: true

find:
  enabled: true

task:
  eager: always
  showResolvedModelBadge: true
  softRequestBudget: 200
  softRequestBudgetNotice: true
  batch: true
  enableLsp: true
  enableEffort: true
  maxEffort: max
  maxConcurrency: 16
  maxRecursionDepth: 2
  maxRuntimeMs: 3600000
  agentModelOverrides:
    reviewer: "@task"
    security-reviewer: "@task"
    code-reviewer: "@task"
    plan-reviewer: "@task"

modelRoles:
  smol: openai-codex/gpt-5.6-luna:medium
  advisor: openai-codex/gpt-5.6-sol:medium
  designer: anthropic/claude-opus-5:high
  plan: anthropic/claude-opus-5:xhigh
  commit: openai-codex/gpt-5.6-luna:medium
  task: openai-codex/gpt-5.6-sol:high
  vision: anthropic/claude-opus-5:medium
  tiny: openai-codex/gpt-5.6-luna:low
  default: anthropic/claude-opus-5:high
  slow: anthropic/claude-opus-5:xhigh
  fable: anthropic/claude-fable-5-1:medium
  switch_fable: anthropic/claude-fable-5-1:medium
  astra: openai-codex/gpt-6-astra:xhigh
  web: web/firecrawl

modelTags:
  fable:
    name: Fable 5.1
  switch_fable:
    name: Fable switch default
    hidden: true
  astra:
    name: GPT-6 Astra

display:
  showTokenUsage: true

providers:
  anthropic:
    serverSideFallback: false
  fetch: auto
  webSearchTimeoutSeconds: 30

retry:
  usageAwareFallback: true
  fallbackChains:
    default:
      - openai-codex/gpt-5.6-sol:high
    advisor:
      - anthropic/claude-opus-5:medium
    task:
      - anthropic/claude-opus-5:high
    vision:
      - openai-codex/gpt-5.6-sol:medium
    smol:
      - anthropic/claude-opus-5:low
    tiny:
      - anthropic/claude-opus-5:low
    commit:
      - anthropic/claude-opus-5:medium
    switch_fable: []
    fable:
      - openai-codex/gpt-6-astra:xhigh
    astra:
      - anthropic/claude-fable-5-1:medium
    web:
      - web/exa
      - web/perplexity
      - google/gemini-2.5-flash
      - openai-codex/gpt-5.6-luna
      - web/parallel
      - google-antigravity/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai/grok-4.5
      - xai-oauth/grok-4.5
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/brave
      - web/kimi
      - web/synthetic
      - web/ollama
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public

includeWorkspaceTree: false

branchSummary:
  enabled: true

commands:
  enableOpencodeProject: false
  enableOpencodeUser: false

skills:
  enableClaudeUser: false
  enableCodexUser: false
  enableAgentsUser: true

steeringMode: all

dev:
  autoqa: false
  autoqaConsent: denied

compaction:
  thresholdTokens: -1
  idleEnabled: true
  handoffSaveToDisk: true

doubleEscapeAction: tree
textVerbosity: low

features:
  unexpectedStopDetection: smart

codexResets:
  autoRedeem: "no"

startup:
  quiet: true

tools:
  approvalMode: yolo
