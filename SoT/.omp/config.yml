      - web/kimi
      - web/synthetic
      - web/ollama
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public

includeWorkspaceTree: false

branchSummary:
  enabled: true

commands:
  enableOpencodeProject: false
  enableOpencodeUser: false

skills:
  enableClaudeUser: false
  enableCodexUser: false
  enableAgentsUser: true

steeringMode: all

dev:
  autoqa: false
  autoqaConsent: denied

compaction:
  thresholdTokens: -1
  idleEnabled: true
  handoffSaveToDisk: true

doubleEscapeAction: tree
textVerbosity: low

features:
  unexpectedStopDetection: smart

codexResets:
  autoRedeem: "no"

startup:
  quiet: true

tools:
  approvalMode: yolo

bash:
  # First match wins. omp checks deny and prompt rules against the whole line
  # and each quote-stripped segment, so `rm -rf "$HOME"` matches `rm * $HOME`.
  # `*` matches any text, spaces and slashes included; no escape spells a
  # literal `*`.
  # No rule matches a plain rm, git rm, git worktree remove, gio trash, or
  # docks-kit scratch remove, so yolo runs it.
  # omp's critical-command check turns a prompt into an allow under yolo, so
  # every rm shape it can flag is denied.
  patterns:
    # Deny: rm of the home directory or the filesystem root, sudo before rm,
    # rm with an r or f option before an absolute path, recursive rm (bare, by
    # path, or after any word such as env, xargs, find -exec, or git), bulk
    # removal through find -delete, find -exec rm, and xargs rm, HOME
    # reassignment, a force push to main or master, and a $ or a backtick
    # after git push.
    - { match: "rm /", approval: deny }
    - { match: "rm / *", approval: deny }
    - { match: "rm * /", approval: deny }
    - { match: "rm * / *", approval: deny }
    - { match: "rm ~", approval: deny }
    - { match: "rm ~ *", approval: deny }
    - { match: "rm * ~", approval: deny }
    - { match: "rm * ~ *", approval: deny }
    - { match: "rm ~/", approval: deny }
    - { match: "rm ~/ *", approval: deny }
    - { match: "rm * ~/", approval: deny }
    - { match: "rm * ~/ *", approval: deny }
    - { match: "rm $HOME", approval: deny }
    - { match: "rm $HOME *", approval: deny }
    - { match: "rm * $HOME", approval: deny }
    - { match: "rm * $HOME *", approval: deny }
    - { match: "rm $HOME/", approval: deny }
    - { match: "rm $HOME/ *", approval: deny }
    - { match: "rm * $HOME/", approval: deny }
    - { match: "rm * $HOME/ *", approval: deny }
    - { match: "rm ${HOME}", approval: deny }
    - { match: "rm ${HOME} *", approval: deny }
