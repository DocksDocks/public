statusLine:
  compactThinkingLevel: false

defaultThinkingLevel: high

cycleOrder:
  - smol
  - default
  - slow
  - fable
  - astra

tier:
  anthropic: none

advisor:
  enabled: true
  syncBacklog: "1"

github:
  enabled: true

find:
  enabled: true

task:
  eager: always
  showResolvedModelBadge: true
  softRequestBudget: 200
  softRequestBudgetNotice: true
  batch: true
  enableLsp: true
  enableEffort: true
  maxEffort: xhigh
  maxConcurrency: 16
  maxRecursionDepth: 2
  maxRuntimeMs: 3600000
  agentModelOverrides:
    reviewer: "@reviewer"
    security-reviewer: "@reviewer"
    code-reviewer: "@reviewer"
    plan-reviewer: "@reviewer"

modelRoles:
  smol: openai-codex/gpt-6-luna:medium
  advisor: anthropic/claude-opus-5-5:medium
  designer: anthropic/claude-opus-5-5:high
  plan: anthropic/claude-opus-5-5:xhigh
  commit: openai-codex/gpt-6-luna:medium
  task: anthropic/claude-opus-5-5:high
  vision: anthropic/claude-opus-5-5:medium
  tiny: openai-codex/gpt-6-luna:low
  default: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-opus-5-5:xhigh
  fable: anthropic/claude-fable-5-1:medium
  switch_fable: anthropic/claude-fable-5-1:medium
  astra: openai-codex/gpt-6-astra:xhigh
  reviewer: openai-codex/gpt-6.1-sol:xhigh
  web: web/firecrawl

modelTags:
  fable:
    name: Fable 5.1
  switch_fable:
    name: Fable switch default
    hidden: true
  astra:
    name: GPT-6 Astra
  reviewer:
    name: Reviewer
    hidden: true

display:
  showTokenUsage: true

providers:
  anthropic:
    serverSideFallback: false
  fetch: auto
  webSearchTimeoutSeconds: 30

retry:
  usageAwareFallback: true
  fallbackChains:
    default:
      - openai-codex/gpt-6.1-sol:high
    advisor: []
    task:
      - openai-codex/gpt-6.1-sol:high
    vision:
      - openai-codex/gpt-6.1-sol:medium
    smol:
      - anthropic/claude-opus-5-5:low
    tiny:
      - anthropic/claude-opus-5-5:low
    commit:
      - anthropic/claude-opus-5-5:medium
    switch_fable: []
    fable:
      - openai-codex/gpt-6-astra:xhigh
    astra:
      - anthropic/claude-fable-5-1:medium
    reviewer:
      - anthropic/claude-opus-5-5:xhigh
    web:
      - web/exa
      - web/perplexity
      - openai-codex/gpt-6-luna
      - web/parallel
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/brave
      - web/kimi
      - web/synthetic
      - web/ollama
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public

includeWorkspaceTree: false

branchSummary:
  enabled: true

commands:
  enableOpencodeProject: false
  enableOpencodeUser: false

skills:
  enableClaudeUser: false
  enableCodexUser: false
  enableAgentsUser: true

steeringMode: all

dev:
  autoqa: false
  autoqaConsent: denied

compaction:
  thresholdTokens: -1
  idleEnabled: true
  handoffSaveToDisk: true

doubleEscapeAction: tree
textVerbosity: low

features:
  unexpectedStopDetection: smart

codexResets:
  autoRedeem: "no"

startup:
  quiet: true

tools:
  approvalMode: yolo

bash:
  # First match wins. omp checks deny and prompt rules against the whole line
  # and each quote-stripped segment, so `rm -rf "$HOME"` matches `rm * $HOME`.
  # `*` matches any text, spaces included; no escape spells a literal `*`.
  # omp's critical-command check turns a prompt into an allow under yolo,
  # so every rm shape it can flag is denied, not prompted.
  patterns:
    # Deny: rm of the home directory or the filesystem root, sudo before rm,
    # rm with an r or f option before an absolute path, recursive rm, HOME
    # reassignment, and a force push to main or master.
    - { match: "rm /", approval: deny }
    - { match: "rm / *", approval: deny }
    - { match: "rm * /", approval: deny }
    - { match: "rm * / *", approval: deny }
    - { match: "rm ~", approval: deny }
    - { match: "rm ~ *", approval: deny }
    - { match: "rm * ~", approval: deny }
    - { match: "rm * ~ *", approval: deny }
    - { match: "rm ~/", approval: deny }
    - { match: "rm ~/ *", approval: deny }
    - { match: "rm * ~/", approval: deny }
    - { match: "rm * ~/ *", approval: deny }
    - { match: "rm $HOME", approval: deny }
    - { match: "rm $HOME *", approval: deny }
    - { match: "rm * $HOME", approval: deny }
    - { match: "rm * $HOME *", approval: deny }
    - { match: "rm $HOME/", approval: deny }
    - { match: "rm $HOME/ *", approval: deny }
    - { match: "rm * $HOME/", approval: deny }
    - { match: "rm * $HOME/ *", approval: deny }
    - { match: "rm ${HOME}", approval: deny }
    - { match: "rm ${HOME} *", approval: deny }
    - { match: "rm * ${HOME}", approval: deny }
    - { match: "rm * ${HOME} *", approval: deny }
    - { match: "rm ${HOME}/", approval: deny }
    - { match: "rm ${HOME}/ *", approval: deny }
    - { match: "rm * ${HOME}/", approval: deny }
    - { match: "rm * ${HOME}/ *", approval: deny }
    - { match: "* rm /", approval: deny }
    - { match: "* rm / *", approval: deny }
    - { match: "* rm * /", approval: deny }
    - { match: "* rm * / *", approval: deny }
    - { match: "* rm ~", approval: deny }
    - { match: "* rm ~ *", approval: deny }
    - { match: "* rm * ~", approval: deny }
    - { match: "* rm * ~ *", approval: deny }
    - { match: "* rm ~/", approval: deny }
    - { match: "* rm ~/ *", approval: deny }
    - { match: "* rm * ~/", approval: deny }
    - { match: "* rm * ~/ *", approval: deny }
    - { match: "* rm $HOME", approval: deny }
    - { match: "* rm $HOME *", approval: deny }
    - { match: "* rm * $HOME", approval: deny }
    - { match: "* rm * $HOME *", approval: deny }
    - { match: "* rm $HOME/", approval: deny }
    - { match: "* rm $HOME/ *", approval: deny }
    - { match: "* rm * $HOME/", approval: deny }
    - { match: "* rm * $HOME/ *", approval: deny }
    - { match: "* rm ${HOME}", approval: deny }
    - { match: "* rm ${HOME} *", approval: deny }
    - { match: "* rm * ${HOME}", approval: deny }
    - { match: "* rm * ${HOME} *", approval: deny }
