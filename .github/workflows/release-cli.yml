name: release-cli

# Build and verify the docks-kit release payload, attach binaries to the tagged
# GitHub release, then publish the exact package tarball through npm OIDC.

on:
  push:
    tags:
      - "cli-v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-bun-cache

      - name: Install dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun install --frozen-lockfile

      - name: Validate release version
        id: release_version
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: |
          release_version="${GITHUB_REF_NAME#cli-v}"
          if [[ -z "$release_version" ]]; then
            echo "::error::release version must be non-empty"
            exit 1
          fi
          package_version="$(bun -p 'require("./package.json").version')"
          if [[ "$release_version" != "$package_version" ]]; then
            echo "::error::tag version '$release_version' does not match package.json version '$package_version'"
            exit 1
          fi
          printf 'release_version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run typecheck

      - name: Build binaries (all four targets)
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run build:binaries

      - name: Pack npm tarball
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun pm pack --destination cli/dist

      - name: Verify exact npm tarball
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.release_version }}
        run: |
          expected="cli/dist/docks-kit-${RELEASE_VERSION}.tgz"
          shopt -s nullglob
          tarballs=(cli/dist/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 || "${tarballs[0]}" != "$expected" ]]; then
            echo "::error::expected exactly one tarball at '$expected'"
            exit 1
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-cli-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            cli/dist/docks-kit-linux-x64
            cli/dist/docks-kit-linux-arm64
            cli/dist/docks-kit-darwin-x64
            cli/dist/docks-kit-darwin-arm64
            cli/dist/SHA256SUMS
            cli/dist/docks-kit-${{ steps.release_version.outputs.release_version }}.tgz

  github-release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-cli-${{ github.ref_name }}
          path: release-dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            release-dist/docks-kit-linux-x64 \
            release-dist/docks-kit-linux-arm64 \
            release-dist/docks-kit-darwin-x64 \
            release-dist/docks-kit-darwin-arm64 \
            release-dist/SHA256SUMS \
            --clobber

  npm-publish:
    needs: [build, github-release]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-cli-${{ github.ref_name }}
          path: release-dist

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Install pinned npm
        run: npm install --global npm@11.18.0

      - name: Publish exact version when absent
        run: |
          release_version="${GITHUB_REF_NAME#cli-v}"
          if [[ -z "$release_version" ]]; then
            echo "::error::release version must be non-empty"
            exit 1
          fi

          expected_tgz="release-dist/docks-kit-${release_version}.tgz"
          shopt -s nullglob
          tarballs=(release-dist/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 || "${tarballs[0]}" != "$expected_tgz" ]]; then
            echo "::error::expected exactly one downloaded tarball at '$expected_tgz'"
            exit 1
          fi
          tgz="${tarballs[0]}"

          view_error="$(mktemp)"
          trap 'rm -f "$view_error"' EXIT
          set +e
          published_version="$(npm view "docks-kit@${release_version}" version 2>"$view_error")"
          view_status=$?
          set -e

          if [[ "$view_status" -eq 0 ]]; then
            cat "$view_error" >&2
            if [[ "$published_version" != "$release_version" ]]; then
              echo "::error::npm returned version '$published_version', expected '$release_version'"
              exit 1
            fi
            echo "docks-kit@${release_version} is already published"
            exit 0
          fi

          cat "$view_error" >&2
          if grep -qE '(^|[[:space:]])E404([[:space:]]|$)' "$view_error"; then
            npm publish "$tgz" --provenance --access public
            exit 0
          fi

          exit "$view_status"
