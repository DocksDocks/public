name: release-cli

# Build and verify the docks-kit release payload, attach binaries to the tagged
# GitHub release, then publish the exact package tarball through npm OIDC.
#
# The release identity is resolved exactly once, in `resolve`, and every later
# job consumes that output. A tag push supplies it through `github.ref_name`; a
# manual dispatch supplies it through `inputs.tag`.
#
# Both paths check out the ref that triggered the run, never an override. That
# is deliberate: `npm publish --provenance` builds its attestation from
# GITHUB_REF and GITHUB_SHA, not from what the build checked out, so a checkout
# override would mint an attestation naming a ref that did not produce the
# bytes. The dispatch path instead proves that every packaged file is
# byte-identical to the tag's tree, which makes the attested ref and the
# published content agree.
#
# The dispatch path exists because a tag is burned on first push: it can never
# be recreated, and re-running a failed run replays the workflow bytes from the
# tag commit. Without a dispatch, one failure after the tag push strands the
# release permanently.

on:
  push:
    tags:
      # Kept in step with the `resolve` job's exact pattern, so a tag that
      # triggers this workflow is never rejected later as unparseable.
      - "cli-v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing cli-v<version> tag to build and publish"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      release_version: ${{ steps.identity.outputs.release_version }}
    steps:
      - name: Resolve release identity
        id: identity
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$tag' must be cli-v<major>.<minor>.<patch>"
            exit 1
          fi
          release_version="${tag#cli-v}"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'release_version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # No `ref:` override. An empty `ref` makes actions/checkout pin the
      # event's commit and assert it, which is exactly the guarantee a release
      # build needs; supplying a ref name would disable that assertion and
      # would resolve a same-named branch ahead of the tag.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-bun-cache

      - name: Install dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun install --frozen-lockfile

      - name: Validate release version
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: |
          package_version="$(bun -p 'require("./package.json").version')"
          if [[ "$RELEASE_VERSION" != "$package_version" ]]; then
            echo "::error::tag version '$RELEASE_VERSION' does not match package.json version '$package_version'"
            exit 1
          fi

      - name: Full test gate
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run test:ci

      - name: Build binaries (all six targets)
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run build:binaries

      - name: Pack npm tarball
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun pm pack --destination cli/dist

      - name: Verify exact npm tarball
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: |
          expected="cli/dist/docks-kit-${RELEASE_VERSION}.tgz"
          shopt -s nullglob
          tarballs=(cli/dist/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 || "${tarballs[0]}" != "$expected" ]]; then
            echo "::error::expected exactly one tarball at '$expected'"
            exit 1
          fi

      - name: Prove the packed tarball is the tag's content
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: |
          set -euo pipefail

          # `bun pm pack` packs the WORKING TREE, so neither trigger proves by
          # itself that the tarball is the tag's bytes. A dispatch runs from a
          # branch, so `npm publish --provenance` would otherwise attest that
          # branch; a tag push checks out the tag, so only the tree can drift.
          # Both failures publish the wrong bytes under a correct-looking
          # attestation, so this runs unconditionally.
          git fetch --no-tags --depth=1 origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          # Declared roots are package.json `files` plus what npm packs anyway:
          # the manifest, and LICENCE in either spelling. Every declared root is
          # compared even when absent from this checkout, because dropping an
          # absent root would hide a branch that deleted a whole packaged
          # directory: the tarball would omit it too. A pathspec matching nothing
          # in either tree is simply quiet.
          # Both lists are produced by an ordinary command into a file, never by
          # process substitution: `mapfile < <(producer)` discards the producer's
          # exit status even under strict mode, so a producer that prints some
          # valid lines and then fails would silently shorten the comparison.
          lists="$(mktemp -d)"
          if ! bun -p '["package.json", "LICENSE", "LICENCE", ...require("./package.json").files].join("\n")' > "$lists/roots"; then
            echo "::error::could not read the packaged roots from package.json"
            exit 1
          fi
          mapfile -t roots < "$lists/roots"
          if [[ "${#roots[@]}" -lt 4 ]]; then
            echo "::error::package.json declares no files array to compare"
            exit 1
          fi

          # 1. The tree must match HEAD across those roots, which is what catches
          #    a deletion or edit that git tracks.
          status="$(git status --porcelain -- "${roots[@]}")"
          if [[ -n "$status" ]]; then
            echo "::error::working tree differs from HEAD across packaged roots"
            printf '%s\n' "$status"
            exit 1
          fi

          # 2. HEAD must match the tag across those roots, which is what catches a
          #    dispatch branch that committed drift the tarball would inherit.
          if ! git diff --quiet "refs/tags/${RELEASE_TAG}" HEAD -- "${roots[@]}"; then
            echo "::error::packaged content differs from ${RELEASE_TAG}"
            git diff --name-status "refs/tags/${RELEASE_TAG}" HEAD -- "${roots[@]}"
            exit 1
          fi

          # 3. The tarball's own files must equal the tag's. Checks 1 and 2 are
          #    blind to paths git ignores, and `bun pm pack` packs an ignored file
          #    that sits under a declared root, so a stray editor backup or tool
          #    output inside `cli/src` ships while `git status` and `git diff` stay
          #    quiet. Rebuilding the same member list from the tag turns "the roots
          #    agree" into "these files hold these bytes", and `git archive` fails
          #    outright when a packed path does not exist at the tag.
          tgz="cli/dist/docks-kit-${RELEASE_VERSION}.tgz"
          if [[ ! -f "$tgz" ]]; then
            echo "::error::no tarball to compare at '$tgz'"
            exit 1
          fi
          packed_dir="$(mktemp -d)"
          tagged_dir="$(mktemp -d)"
          tar -xzf "$tgz" --strip-components=1 -C "$packed_dir"
          if ! ( cd "$packed_dir" && find . -type f -printf '%P\n' ) > "$lists/members"; then
            echo "::error::could not list the unpacked tarball"
            exit 1
          fi
          LC_ALL=C sort -o "$lists/members" "$lists/members"
          mapfile -t members < "$lists/members"
          if [[ "${#members[@]}" -eq 0 ]]; then
            echo "::error::tarball '$tgz' unpacked to no files"
            exit 1
          fi
          if ! git archive --format=tar "refs/tags/${RELEASE_TAG}" -- "${members[@]}" \
            > "$packed_dir.tar" 2> "$packed_dir.err"; then
            echo "::error::a packed file does not exist at ${RELEASE_TAG}"
            cat "$packed_dir.err"
            exit 1
          fi
          tar -xf "$packed_dir.tar" -C "$tagged_dir"
          if ! diff -r "$packed_dir" "$tagged_dir"; then
            echo "::error::tarball bytes differ from ${RELEASE_TAG}"
            exit 1
          fi

          printf 'content of every packed file matches %s: %d files\n' \
            "$RELEASE_TAG" "${#members[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-cli-${{ needs.resolve.outputs.tag }}
          if-no-files-found: error
          path: |
            cli/dist/docks-kit-linux-x64
            cli/dist/docks-kit-linux-arm64
            cli/dist/docks-kit-darwin-x64
            cli/dist/docks-kit-darwin-arm64
            cli/dist/docks-kit-windows-x64.exe
            cli/dist/docks-kit-windows-arm64.exe
            cli/dist/SHA256SUMS
            cli/dist/docks-kit-${{ needs.resolve.outputs.release_version }}.tgz

  github-release:
    needs: [resolve, build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-cli-${{ needs.resolve.outputs.tag }}
          path: release-dist

      - name: Create release and upload only missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --verify-tag --generate-notes

          # Never replace a published asset: a release asset is immutable
          # evidence that the Docks parent release lane pins. Upload only what
          # is absent, so a re-driven run is idempotent instead of destructive.
          # The listing's exit status is checked explicitly, because reading it
          # through a process substitution would turn a transient API failure
          # into a silently empty "nothing is published yet".
          present="$(mktemp)"
          if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$present"; then
            echo "::error::could not list existing assets for $RELEASE_TAG"
            exit 1
          fi
          for asset in docks-kit-linux-x64 docks-kit-linux-arm64 docks-kit-darwin-x64 docks-kit-darwin-arm64 docks-kit-windows-x64.exe docks-kit-windows-arm64.exe SHA256SUMS; do
            if grep -Fxq "$asset" "$present"; then
              echo "asset already published, leaving untouched: $asset"
              continue
            fi
            gh release upload "$RELEASE_TAG" "release-dist/$asset"
          done

  npm-publish:
    needs: [resolve, build, github-release]
    permissions:
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-cli-${{ needs.resolve.outputs.tag }}
          path: release-dist

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Install pinned npm
        run: npm install --global npm@11.18.0

      - name: Publish exact version when absent
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: |
          expected_tgz="release-dist/docks-kit-${RELEASE_VERSION}.tgz"
          shopt -s nullglob
          tarballs=(release-dist/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 || "${tarballs[0]}" != "$expected_tgz" ]]; then
            echo "::error::expected exactly one downloaded tarball at '$expected_tgz'"
            exit 1
          fi
          # npm-package-arg only treats an argument as a local tarball when it
          # starts with ./, ../, / or file:. A bare `dir/name.tgz` is parsed as
          # the GitHub shorthand <owner>/<repo>, so npm resolves it over SSH and
          # the publish fails with "Permission denied (publickey)". Keep the ./.
          tgz="./${tarballs[0]}"

          view_error="$(mktemp)"
          trap 'rm -f "$view_error"' EXIT
          set +e
          published_version="$(npm view "docks-kit@${RELEASE_VERSION}" version 2>"$view_error")"
          view_status=$?
          set -e

          if [[ "$view_status" -eq 0 ]]; then
            cat "$view_error" >&2
            if [[ "$published_version" != "$RELEASE_VERSION" ]]; then
              echo "::error::npm returned version '$published_version', expected '$RELEASE_VERSION'"
              exit 1
            fi
            echo "docks-kit@${RELEASE_VERSION} is already published"
            exit 0
          fi

          cat "$view_error" >&2
          if grep -qE '(^|[[:space:]])E404([[:space:]]|$)' "$view_error"; then
            npm publish "$tgz" --provenance --access public
            exit 0
          fi

          exit "$view_status"
