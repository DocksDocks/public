name: check

# Fast check gate on pushes to `main` and on pull requests: lint, format
# check, typecheck, the generated-payload check, unit tests, and both golden
# suites through the `check` package script. `parity.yml` adds the dependency
# audit, package/runtime/native smokes, source-entry goldens, and prove-red
# runs, and it repeats the generated-payload check; release stays in
# `release-cli.yml`.

on:
  # Only `main` pushes start a `push` run. With no branch filter, each push to
  # a pull request branch also started a `push` run on the SHA that the
  # `pull_request` run tests. Of 318 `check` runs since 2026-09-13, 150 (47 %)
  # repeated a SHA that another `check` run tested: 116 branch pushes (92 with
  # a `pull_request` run on the same SHA, 24 at a `main` head) and 34
  # `cli-v*` tag pushes. Every `cli-v*` tag is on `main`, so the `main` run of
  # that commit covers it, and the `release-cli.yml` build runs `test:ci`
  # again.
  push:
    branches: [main]
  pull_request:

concurrency:
  # A pull request keeps one group, so a newer head cancels the stale run.
  # Every other run gets its own group. In one group, GitHub replaces a
  # pending run with the newer run, also with `cancel-in-progress: false`.
  # The shared `main` group of `parity.yml` did this to run 39826349216
  # (`golden-regression`, 2026-10-22): it ended cancelled with 0 jobs, so its
  # `main` commit got no green run. With a group per run, every `main` run
  # finishes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04 # pinned label, never *-latest
    # 3 x (p90 57 s + 9 s cold setup) = 198 s, rounded up.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun-cache

      - name: Install dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun install --frozen-lockfile

      - name: Check gate
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run check
