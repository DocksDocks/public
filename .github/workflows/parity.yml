name: golden-regression

# EngineNative portable and Linux-canonical golden-regression gates.

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "SoT/**"
      - "notification.mp3"
      - "docks-kit"
      - "docks-kit.ps1"
      - "install.sh"
      - "install.ps1"
      - "package.json"
      - "bun.lock"
      - "vitest.config.ts"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "cli/**"
      - "SoT/**"
      - "notification.mp3"
      - "docks-kit"
      - "docks-kit.ps1"
      - "install.sh"
      - "install.ps1"
      - "package.json"
      - "bun.lock"
      - "vitest.config.ts"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A superseded pull request commit is noise, but a superseded `main` commit
  # would be left with no green run, which is the record a later bisect reads.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Workflow lint runs once on its pinned Linux actionlint artifact.
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-24.04 # pinned label, never *-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows (actionlint)
        env:
          # Pinned release + published checksum: a mutable tag or an unverified
          # download would let a compromised asset run in CI.
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # Portable lane proves the typed CLI, runtime commands, and native host artifact.
  portable:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun-cache

      - name: Install dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun install --frozen-lockfile

      - name: Audit dependencies for vulnerabilities
        if: matrix.os == 'ubuntu-24.04'
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun audit

      - name: Generated payload is fresh
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run check:generated

      - name: Typecheck
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run typecheck

      - name: Unit tests (vitest + @effect/vitest)
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run test:unit

      - name: Clean-room package install smoke
        if: matrix.os == 'ubuntu-24.04'
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run smoke:package

      - name: Materialized Claude runtime commands (POSIX shell + p95)
        if: runner.os != 'Windows'
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run test:runtime:posix

      - name: Materialized Claude runtime commands (Windows + p95)
        if: runner.os == 'Windows'
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run test:runtime:windows

      - name: Compile and execute the native host artifact
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run smoke:native

  # Snapshot lane keeps Linux-canonical goldens and their prove-red checks.
  golden-dryrun:
    permissions:
      contents: read
    runs-on: ubuntu-24.04 # pinned label, never *-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun-cache

      - name: Install dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun install --frozen-lockfile

      - name: Dry-run golden regression
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run golden:dryrun

      # The suites spawn a bundle of the CLI so Bun transpiles it once instead
      # of once per child. This step runs the same cases against the
      # TypeScript entry, which is the form the npm package ships, so a defect
      # the bundler hides cannot pass unseen. It is the cheapest lane, and the
      # two forms must agree on every case.
      - name: Dry-run golden regression (source entry)
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          DOCKS_KIT_TEST_CLI_ENTRY: ${{ github.workspace }}/cli/src/main.ts
        run: bun run golden:dryrun

      - name: Dry-run golden can fail (prove-red)
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: |
          set +e
          out="$(bun run golden:dryrun --prove-red 2>&1)"
          code=$?
          printf '%s\n' "$out"
          if [[ "$code" -eq 0 ]]; then
            echo "::error::prove-red unexpectedly exited 0"
            exit 1
          fi
          if ! grep -q "prove-red OK: golden-dryrun" <<<"$out"; then
            echo "::error::prove-red failed without proving the planted mismatch"
            exit 1
          fi

  golden-mutation:
    permissions:
      contents: read
    runs-on: ubuntu-24.04 # pinned label, never *-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun-cache

      - name: Install dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun install --frozen-lockfile

      - name: Mutation golden regression
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun run golden:mutation

      - name: Mutation golden can fail (prove-red)
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: |
          set +e
          out="$(bun run golden:mutation --prove-red 2>&1)"
          code=$?
          printf '%s\n' "$out"
          if [[ "$code" -eq 0 ]]; then
            echo "::error::prove-red unexpectedly exited 0"
            exit 1
          fi
          if ! grep -q "prove-red OK: golden-mutation" <<<"$out"; then
            echo "::error::prove-red failed without proving the planted mismatch"
            exit 1
          fi
